<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kanban</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root {
            --bg-color: #F7F9FC;
            --text-color: #111827;
            --text-muted: #6B7280;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
            --column-bg: #F3F4F6;
            --column-header: #374151;
            --danger-bg: #FEF2F2;
            --danger-text: #DC2626;
            --success-bg: #F0FDF4;
            --success-text: #166534;
            --accent-color: #3B82F6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
            border-bottom: 1px solid var(--card-border);
            background-color: var(--card-bg);
            z-index: 10;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* KANBAN BOARD */
        .board-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }

        .board {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            flex-grow: 1;
            padding: 16px;
            gap: 16px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .column {
            flex: 0 0 85vw;
            max-width: 350px;
            background-color: var(--column-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            scroll-snap-align: center;
            border: 1px solid var(--card-border);
            max-height: 100%;
        }

        .column-header {
            padding: 16px;
            font-weight: 600;
            color: var(--column-header);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px; /* Close gap between title and count */
        }
        
        .column-title {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .count {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        .task-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 12px;
            min-height: 100px;
        }

        /* TASK CARD */
        .task-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            cursor: pointer;
        }
        
        .task-card:active {
            transform: scale(0.98);
        }

        .task-id {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .task-content {
            margin-bottom: 12px;
            word-break: break-word;
        }
        
        .task-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            border-top: 1px solid var(--card-border);
            padding-top: 8px;
            margin-top: 8px;
        }
        
        .action-btn {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            background-color: var(--column-bg);
            transition: background-color 0.2s;
        }
        
        .action-btn:active {
            background-color: #E5E7EB;
        }
        
        .action-btn.delete {
            color: var(--danger-text);
            background-color: var(--danger-bg);
        }

        /* NOTE VIEWER */
        .note-viewer {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
            background-color: var(--bg-color);
        }
        
        .note-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            background-color: var(--card-bg);
        }
        
        .back-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-weight: 500;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 0;
        }
        
        .note-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: var(--card-bg);
            line-height: 1.6;
            color: var(--text-color);
            font-size: 15px;
            user-select: text;
            -webkit-user-select: text;
        }
        
        /* Markdown styles */
        .note-content h1, .note-content h2, .note-content h3 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            font-weight: 600;
        }
        .note-content p {
            margin-bottom: 1em;
        }
        .note-content ul, .note-content ol {
            margin-bottom: 1em;
            padding-left: 20px;
        }
        .note-content pre {
            background: #F3F4F6;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 1em;
        }
        .note-content code {
            background: #F3F4F6;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
        }

        /* BOTTOM SHEET (MODAL) */
        .bottom-sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .bottom-sheet-overlay.active {
            display: block;
            opacity: 1;
        }

        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 24px;
            z-index: 2001;
            transition: bottom 0.3s cubic-bezier(0.1, 0.8, 0.2, 1);
            box-shadow: 0 -4px 16px rgba(0,0,0,0.1);
        }
        
        .bottom-sheet.active {
            bottom: 0;
        }
        
        .sheet-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }

        .sheet-option {
            padding: 14px;
            border-radius: 12px;
            background: var(--column-bg);
            margin-bottom: 8px;
            text-align: center;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .sheet-option:active {
            background: #E5E7EB;
        }
        
        .sheet-option.cancel {
            background: transparent;
            color: var(--danger-text);
            margin-top: 16px;
        }

        /* Text Prompt Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
        }

        .modal {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .modal h3 {
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 600;
        }

        .modal input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background: var(--bg-color);
        }

        .modal input:focus {
            border-color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-cancel {
            background: var(--column-bg);
            color: var(--text-color);
        }

        .btn-submit {
            background: var(--accent-color);
            color: white;
        }
        
        /* Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 3px;
        }
        
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header id="mainHeader">Мои Задачи</header>

    <div class="board-container" id="boardContainer">
        <div class="board">
            <div class="column" data-status="pending">
                <div class="column-header">
                    <span class="column-title">⏳ Ожидают</span>
                    <span class="count">0</span>
                </div>
                <div class="task-list" id="col-pending"></div>
            </div>
            <div class="column" data-status="In Progress">
                <div class="column-header">
                    <span class="column-title">▶️ В работе</span>
                    <span class="count">0</span>
                </div>
                <div class="task-list" id="col-inprogress"></div>
            </div>
            <div class="column" data-status="Done" style="background-color: var(--success-bg); border-color: #BBF7D0;">
                <div class="column-header" style="color: var(--success-text); border-bottom-color: #BBF7D0;">
                    <span class="column-title">✅ Готово</span>
                    <span class="count">0</span>
                </div>
                <div class="task-list" id="col-done"></div>
            </div>
            <div class="column" data-status="Failed" style="background-color: var(--danger-bg); border-color: #FECACA;">
                <div class="column-header" style="color: var(--danger-text); border-bottom-color: #FECACA;">
                    <span class="column-title">❌ Провалено</span>
                    <span class="count">0</span>
                </div>
                <div class="task-list" id="col-failed"></div>
            </div>
        </div>
    </div>

    <!-- Note Viewer -->
    <div class="note-viewer" id="noteViewer">
        <div class="note-header">
            <button class="back-btn" onclick="closeNote()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                Назад
            </button>
        </div>
        <div class="note-content" id="noteContent">
            <!-- Markdown content will go here -->
        </div>
    </div>

    <!-- Bottom Sheet (Move Task) -->
    <div class="bottom-sheet-overlay" id="moveSheetOverlay" onclick="closeMoveSheet()"></div>
    <div class="bottom-sheet" id="moveSheet">
        <div class="sheet-header">Переместить задачу</div>
        <div class="sheet-option" onclick="selectMoveStatus('pending')">⏳ Ожидает</div>
        <div class="sheet-option" onclick="selectMoveStatus('In Progress')">▶️ В работу</div>
        <div class="sheet-option" onclick="selectMoveStatus('Done')">✅ Готово</div>
        <div class="sheet-option" onclick="selectMoveStatus('Failed')">❌ Провалено</div>
        <div class="sheet-option cancel" onclick="closeMoveSheet()">Отмена</div>
    </div>

    <!-- Modal for Result/Reason -->
    <div class="modal-overlay" id="promptModal">
        <div class="modal">
            <h3 id="modalTitle">Укажите причину/результат</h3>
            <input type="text" id="modalInput" placeholder="Введите текст...">
            <div class="btn-group">
                <button class="btn btn-cancel" id="btnCancel">Отмена</button>
                <button class="btn btn-submit" id="btnSubmit">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // We ignore telegram theme to enforce Apple iOS / Notion style light theme
        // BUT we keep it so the webapp tells telegram it's ready.

        const API_BASE = '';
        const FETCH_HEADERS = {
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
        };
        
        let tasks = [];
        let sortables = [];
        let currentMoveTaskId = null;
        let currentMoveSourceStatus = null;

        async function fetchTasks() {
            try {
                const res = await fetch(`${API_BASE}/api/tasks`, { headers: FETCH_HEADERS });
                if (!res.ok) throw new Error("Network response was not ok");
                tasks = await res.json();
                renderBoard();
            } catch (e) {
                console.error("Failed to load tasks", e);
                tg.showAlert("Не удалось загрузить задачи.");
            }
        }

        function renderBoard() {
            const columns = {
                "pending": document.getElementById('col-pending'),
                "In Progress": document.getElementById('col-inprogress'),
                "Done": document.getElementById('col-done'),
                "Failed": document.getElementById('col-failed'),
            };

            // Clear all
            Object.values(columns).forEach(col => {
                col.innerHTML = '';
                updateCount(col, 0);
            });

            tasks.forEach(task => {
                const status = task.KanbanStatus || 'pending';
                const col = columns[status] || columns['pending'];
                
                const card = document.createElement('div');
                card.className = 'task-card';
                card.dataset.id = task.TaskUUID;
                
                // Content section (clickable to open note)
                const contentDiv = document.createElement('div');
                contentDiv.innerHTML = `
                    <div class="task-id">#${task.TaskUUID}</div>
                    <div class="task-content">${task.Content}</div>
                `;
                contentDiv.onclick = () => openNote(task.TaskUUID);
                
                // Actions section
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'task-actions';
                
                const moveBtn = document.createElement('button');
                moveBtn.className = 'action-btn';
                moveBtn.innerHTML = '🔄 Переместить';
                moveBtn.onclick = (e) => {
                    e.stopPropagation();
                    openMoveSheet(task.TaskUUID, status);
                };
                
                const delBtn = document.createElement('button');
                delBtn.className = 'action-btn delete';
                delBtn.innerHTML = '🗑️ Удалить';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    handleDeleteTask(task.TaskUUID);
                };
                
                actionsDiv.appendChild(moveBtn);
                actionsDiv.appendChild(delBtn);
                
                card.appendChild(contentDiv);
                card.appendChild(actionsDiv);
                
                col.appendChild(card);
            });

            // Update counts
            Object.values(columns).forEach(col => {
                updateCount(col, col.children.length);
            });
            
            initSortable();
        }

        function updateCount(colElement, count) {
            colElement.parentElement.querySelector('.count').innerText = count;
        }

        function initSortable() {
            // Destroy existing instances
            sortables.forEach(s => s.destroy());
            sortables = [];
            
            const lists = document.querySelectorAll('.task-list');
            lists.forEach(list => {
                const sortable = new Sortable(list, {
                    group: 'kanban',
                    animation: 150,
                    ghostClass: 'dragging',
                    delay: 100, // delay for mobile tap vs drag
                    delayOnTouchOnly: true,
                    onEnd: function (evt) {
                        const itemEl = evt.item;
                        const taskId = itemEl.dataset.id;
                        const oldStatus = evt.from.parentElement.dataset.status;
                        const newStatus = evt.to.parentElement.dataset.status;
                        
                        if (oldStatus !== newStatus) {
                            handleStatusChange(taskId, newStatus, oldStatus);
                        }
                    }
                });
                sortables.push(sortable);
            });
        }

        // --- Note Viewer Logic ---
        const boardContainer = document.getElementById('boardContainer');
        const noteViewer = document.getElementById('noteViewer');
        const noteContent = document.getElementById('noteContent');
        const mainHeader = document.getElementById('mainHeader');

        async function openNote(taskId) {
            boardContainer.style.display = 'none';
            noteViewer.style.display = 'flex';
            mainHeader.innerText = 'Просмотр Заметки';
            noteContent.innerHTML = '<div class="loading-spinner">Загрузка...</div>';
            
            try {
                const res = await fetch(`${API_BASE}/api/note?task_id=${taskId}`, { headers: FETCH_HEADERS });
                const data = await res.json();
                
                if (data.error) {
                    noteContent.innerHTML = `<div style="color: var(--danger-text)">${data.error}</div>`;
                } else {
                    noteContent.innerHTML = marked.parse(data.content || '');
                }
            } catch (e) {
                noteContent.innerHTML = `<div style="color: var(--danger-text)">Ошибка загрузки заметки</div>`;
            }
        }

        function closeNote() {
            noteViewer.style.display = 'none';
            boardContainer.style.display = 'flex';
            mainHeader.innerText = 'Мои Задачи';
        }

        // --- Bottom Sheet Logic ---
        const sheetOverlay = document.getElementById('moveSheetOverlay');
        const moveSheet = document.getElementById('moveSheet');

        function openMoveSheet(taskId, currentStatus) {
            currentMoveTaskId = taskId;
            currentMoveSourceStatus = currentStatus;
            
            sheetOverlay.classList.add('active');
            // small timeout to allow display:block to apply before animating bottom
            setTimeout(() => {
                moveSheet.classList.add('active');
            }, 10);
        }

        function closeMoveSheet() {
            moveSheet.classList.remove('active');
            setTimeout(() => {
                sheetOverlay.classList.remove('active');
            }, 300); // match transition duration
        }

        function selectMoveStatus(newStatus) {
            closeMoveSheet();
            if (newStatus !== currentMoveSourceStatus && currentMoveTaskId) {
                handleStatusChange(currentMoveTaskId, newStatus, currentMoveSourceStatus);
            }
        }

        // --- Action Handlers ---
        function handleDeleteTask(taskId) {
            tg.showConfirm("Удалить задачу окончательно?", async (confirmed) => {
                if (confirmed) {
                    try {
                        tg.MainButton.showProgress();
                        await fetch(`${API_BASE}/api/delete_task`, {
                            method: 'POST',
                            headers: FETCH_HEADERS,
                            body: JSON.stringify({task_id: taskId})
                        });
                        tasks = tasks.filter(t => t.TaskUUID !== taskId);
                        renderBoard();
                        tg.HapticFeedback.notificationOccurred('success');
                    } catch (e) {
                        tg.showAlert("Ошибка удаления.");
                        tg.HapticFeedback.notificationOccurred('error');
                    } finally {
                        tg.MainButton.hideProgress();
                    }
                }
            });
        }

        function handleStatusChange(taskId, newStatus, oldStatus) {
            if (newStatus === 'Done' || newStatus === 'Failed') {
                showPrompt(newStatus === 'Done' ? 'Укажите результат выполнения:' : 'Укажите причину провала:', async (reason) => {
                    if (reason !== null) {
                        await saveStatusChange(taskId, newStatus, reason);
                    } else {
                        renderBoard(); // revert UI if cancelled
                    }
                });
            } else {
                saveStatusChange(taskId, newStatus, '');
            }
        }

        async function saveStatusChange(taskId, status, reason) {
            try {
                tg.MainButton.showProgress();
                const res = await fetch(`${API_BASE}/api/update_task`, {
                    method: 'POST',
                    headers: FETCH_HEADERS,
                    body: JSON.stringify({task_id: taskId, status: status, reason: reason})
                });
                
                if (!res.ok) throw new Error("Server error");
                
                // Update local state
                const task = tasks.find(t => t.TaskUUID === taskId);
                if (task) task.KanbanStatus = status;
                renderBoard();
                tg.HapticFeedback.notificationOccurred('success');
            } catch (e) {
                console.error(e);
                tg.showAlert("Ошибка синхронизации.");
                tg.HapticFeedback.notificationOccurred('error');
                fetchTasks(); // Reload from server
            } finally {
                tg.MainButton.hideProgress();
            }
        }

        // --- Custom Prompt Modal ---
        const modal = document.getElementById('promptModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalInput = document.getElementById('modalInput');
        let modalResolve = null;

        function showPrompt(title, callback) {
            modalTitle.innerText = title;
            modalInput.value = '';
            modal.style.display = 'flex';
            modalInput.focus();
            modalResolve = callback;
        }

        document.getElementById('btnCancel').onclick = () => {
            modal.style.display = 'none';
            if (modalResolve) modalResolve(null);
        };

        document.getElementById('btnSubmit').onclick = () => {
            const val = modalInput.value.trim();
            if (!val) {
                tg.showAlert("Текст не может быть пустым.");
                return;
            }
            modal.style.display = 'none';
            if (modalResolve) modalResolve(val);
        };

        // Initialize
        fetchTasks();
    </script>
</body>
</html>
